services:
  mysql:
    image: mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
    environment:
      MYSQL_DATABASE: ezbookkeeping_pf_test
      MYSQL_USER: pf_test
      MYSQL_PASSWORD: pf_test_password
      MYSQL_ROOT_PASSWORD: pf_root_test_password
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    tmpfs:
      - /var/lib/mysql:rw,nosuid,size=768m
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping --host=127.0.0.1 --user="$${MYSQL_USER}" --password="$${MYSQL_PASSWORD}" --silent
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 10s
    restart: "no"

  postgres:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    environment:
      POSTGRES_DB: ezbookkeeping_pf_test
      POSTGRES_USER: pf_test
      POSTGRES_PASSWORD: pf_test_password
    tmpfs:
      - /var/lib/postgresql/data:rw,nosuid,size=512m
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --host=127.0.0.1 --username="$${POSTGRES_USER}" --dbname="$${POSTGRES_DB}"
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 5s
    restart: "no"

  runner:
    build:
      context: ..
      dockerfile: docker/pf-test-runner.Dockerfile
    working_dir: /workspace
    environment:
      BUILD_PIPELINE: "1"
      CHECK_3RD_API: "0"
      CGO_ENABLED: "1"
      GOCACHE: /testwork/go-build-cache
      GOTOOLCHAIN: local
      EBK_WORK_DIR: /testwork
      EBK_LOG_MODE: console
      EBK_STORAGE_LOCAL_FILESYSTEM_PATH: /testwork/storage
    tmpfs:
      - /testwork:rw,exec,nosuid,size=1g
    profiles:
      - runner
    restart: "no"

networks:
  default:
    internal: true
