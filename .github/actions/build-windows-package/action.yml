name: Build packages for windows

inputs:
  package-file-name-prefix:
    required: true
    description: "The prefix for the windows package file name."
  backend-artifact-name-prefix:
    required: true
    description: "The prefix for the windows backend artifact name."

runs:
  using: "composite"
  steps:
    - name: Download windows-x64 backend file
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.backend-artifact-name-prefix }}-windows-x64
        path: ${{ runner.temp }}\backend

    - name: Download linux-amd64 packaged files
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.package-file-name-prefix }}-linux-amd64.tar.gz
        path: ${{ runner.temp }}\package

    - name: Extract frontend files from linux-amd64 package
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path package
        tar -xzf (Get-ChildItem ${{ runner.temp }}\package\${{ inputs.package-file-name-prefix }}-linux-amd64.tar.gz) -C package

    - name: Package windows-x64 package
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path "catledger"
        New-Item -ItemType Directory -Path "catledger\data"
        New-Item -ItemType Directory -Path "catledger\storage"
        New-Item -ItemType Directory -Path "catledger\log"
        Copy-Item ${{ runner.temp }}\backend\catledger.exe -Destination catledger\
        Copy-Item -Recurse -Force package\public -Destination catledger\public
        Copy-Item -Recurse -Force conf -Destination catledger\conf
        Copy-Item -Recurse -Force templates -Destination catledger\templates
        Copy-Item .\LICENSE -Destination catledger\
        Push-Location catledger
        7z a -r -tzip -mx9 ..\${{ inputs.package-file-name-prefix }}-windows-x64.zip *
        Pop-Location
        Remove-Item -Recurse -Force catledger

    - name: Upload windows artifact
      uses: actions/upload-artifact@v7
      with:
        archive: false
        path: ${{ inputs.package-file-name-prefix }}-windows-x64.zip
        if-no-files-found: error
