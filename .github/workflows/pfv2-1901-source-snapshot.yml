name: PFV2-1901 Source Snapshot

on:
  push:
    branches:
      - codex/pfv2-1901-source-identity

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Package source
        shell: bash
        run: tar --exclude=.git -czf /tmp/pfv2-1901-source.tgz .

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: pfv2-1901-source-${{ github.sha }}
          path: /tmp/pfv2-1901-source.tgz
          retention-days: 1
          if-no-files-found: error
