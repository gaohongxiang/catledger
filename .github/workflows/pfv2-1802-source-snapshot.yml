name: PFV2-1802 Source Snapshot

on:
  push:
    branches:
      - codex/pfv2-1802-source-identity
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v6
        with:
          ref: codex/pfv2-1802-source-identity
          fetch-depth: 0

      - name: Package source
        shell: bash
        run: tar --exclude=.git -czf /tmp/pfv2-1802-source.tgz .

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: pfv2-1802-source-${{ github.sha }}
          path: /tmp/pfv2-1802-source.tgz
          retention-days: 1
          if-no-files-found: error
