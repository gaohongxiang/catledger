name: UI 候选隔离验证
on:
  push:
    branches: [codex/mini-1906ui-import-refinement]
    paths: [.github/workflows/ui-candidate-publish.yml, '.ui-candidate/**']
permissions:
  contents: write
jobs:
  verify-candidate:
    if: github.repository == 'gaohongxiang/catledger' && github.ref == 'refs/heads/codex/mini-1906ui-import-refinement'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: local-synthetic-ci-only
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: catledger_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: 校验并还原指定 UI 候选
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ui-result"
          python3 - <<'PY'
          import base64, gzip, hashlib, os, pathlib, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          base = '1b37788ced1b3ca4cdf4f8a9275bc94db2ec6f62'
          assert git('rev-parse', 'HEAD^') == base, '基线已变化，禁止自动套用'
          names = [f'part{i:02}.txt' for i in range(10)] + ['part100.txt', 'part101.txt', 'part11.txt']
          text = ''.join((pathlib.Path('.ui-candidate') / n).read_text() for n in names)
          assert len(text) == 56056
          packed = base64.b64decode(text, validate=True)
          assert len(packed) == 42041
          patch = gzip.decompress(packed)
          assert len(patch) == 217134
          assert hashlib.sha256(patch).hexdigest() == 'd9560aa49395f47d9ce4640d40ac562c74020c1e4341f012320f2d14104867fa'
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'ui-result' / 'candidate.patch'
          target.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', '--index', str(target)], check=True)
          subprocess.run(['git', 'apply', '--index', str(target)], check=True)
          subprocess.run(['git', 'rm', '-r', '--', '.ui-candidate', '.github/workflows/ui-candidate-publish.yml'], check=True)
          assert git('write-tree') == '0255d6e060977a7373a5946be88f38262ea04cfa', '最终源码与本地已验证候选不一致'
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          subprocess.run(['git', 'diff', '--cached', base, '--stat'], check=True)
          PY
      - run: npm ci --prefix cloudfunctions/catledger-api
      - run: npm ci --prefix cloudfunctions/catledger-import
      - name: 静态检查
        shell: bash
        run: npm run check 2>&1 | tee "$RUNNER_TEMP/ui-result/check.log"
      - name: Node 18 与 MySQL 8.4 全量验证
        shell: bash
        env:
          CATLEDGER_TEST_DB_HOST: 127.0.0.1
          CATLEDGER_TEST_DB_PORT: 3306
          CATLEDGER_TEST_DB_USER: root
          CATLEDGER_TEST_DB_PASSWORD: local-synthetic-ci-only
          CATLEDGER_TEST_DB_NAME: catledger_test
        run: npm run test:db 2>&1 | tee "$RUNNER_TEMP/ui-result/tests.log"
      - name: 生产依赖审计
        shell: bash
        run: |
          npm run audit:prod --prefix cloudfunctions/catledger-api 2>&1 | tee "$RUNNER_TEMP/ui-result/api-audit.log"
          npm run audit:prod --prefix cloudfunctions/catledger-import 2>&1 | tee "$RUNNER_TEMP/ui-result/import-audit.log"
      - name: 上传已验证 Git 对象，不更新任何分支
        shell: bash
        env:
          GH_OBJECT_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, subprocess, urllib.request
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          def post(endpoint, value):
              req = urllib.request.Request('https://api.github.com/repos/gaohongxiang/catledger/git/' + endpoint, data=json.dumps(value).encode(), headers={'Authorization': 'Bearer ' + os.environ['GH_OBJECT_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'}, method='POST')
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)
          base = '1b37788ced1b3ca4cdf4f8a9275bc94db2ec6f62'
          expected = '0255d6e060977a7373a5946be88f38262ea04cfa'
          assert git('write-tree') == expected
          paths = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z', base]).decode().strip('\0').split('\0')
          assert len(paths) == 20
          assert all(p.startswith(('miniprogram/', 'docs/', 'specs/', 'test/')) for p in paths)
          entries = []
          for name in paths:
              path = pathlib.Path(name)
              assert path.is_file() and not path.is_symlink()
              data = path.read_bytes()
              blob = post('blobs', {'content': base64.b64encode(data).decode(), 'encoding': 'base64'})
              assert blob['sha'] == git('hash-object', name)
              entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
          tree = post('trees', {'base_tree': '9ad68d98f7749b02fc9052b24f413d6e47e714a0', 'tree': entries})
          assert tree['sha'] == expected
          result = {'base': base, 'tree_sha': expected, 'files': entries, 'verification': 'Node18-MySQL8.4-check-testdb-audit-passed', 'branch_updated': False}
          (pathlib.Path(os.environ['RUNNER_TEMP']) / 'ui-result' / 'result.json').write_text(json.dumps(result, ensure_ascii=False, indent=2))
          print('已上传 20 个已验证文件的 Git 对象；未创建提交、更新分支或部署。')
          print('tree=' + expected)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-candidate-result
          path: ${{ runner.temp }}/ui-result/
          retention-days: 3
          if-no-files-found: error
