name: UX-1801 Release Gate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ux-1801-release-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify changed Go formatting
        shell: bash
        run: |
          files=$(git diff --name-only --diff-filter=ACMRT origin/main...HEAD -- '*.go')
          if [ -n "$files" ]; then
            unformatted=$(gofmt -l $files)
            if [ -n "$unformatted" ]; then
              printf 'Unformatted Go files:\n%s\n' "$unformatted"
              exit 1
            fi
          fi

      - name: Test organizer and API
        run: go test -count=1 ./pkg/personalfinance/organizer ./pkg/api

      - name: Vet organizer and API
        run: go vet ./pkg/personalfinance/organizer ./pkg/api

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type-check
        run: ./node_modules/.bin/vue-tsc --noEmit

      - name: Lint changed frontend files
        run: >-
          ./node_modules/.bin/eslint
          src/features/personal-finance/desktop/SimpleWorkflow.test.ts
          src/features/personal-finance/organizer/desktop/ResultsFlowPage.vue
          src/features/personal-finance/organizer/models.ts
          src/features/personal-finance/organizer/service.test.ts
          src/features/personal-finance/organizer/service.ts
          src/features/personal-finance/organizer/state.test.ts
          src/features/personal-finance/organizer/state.ts
          src/lib/services.ts

      - name: Test changed frontend flow
        run: >-
          ./node_modules/.bin/vitest run
          src/features/personal-finance/desktop/SimpleWorkflow.test.ts
          src/features/personal-finance/organizer/service.test.ts
          src/features/personal-finance/organizer/state.test.ts

      - name: Build production frontend
        run: npm run build

  cleanup:
    if: success()
    needs:
      - backend
      - frontend
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v6
        with:
          ref: codex/ux-1801-abandon-round
          fetch-depth: 0

      - name: Remove one-shot release gate
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/ux-1801-release-gate.yml
          git commit -m 'chore(ci): remove completed UX-1801 release gate'
          git push origin HEAD:codex/ux-1801-abandon-round
