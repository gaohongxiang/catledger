name: 1906 分支整合与计划登记（一次性）
on:
  push:
    branches: [codex/mini-1906o2-catalog-loading]
    paths: [.github/workflows/1906-consolidate-once.yml]
permissions:
  contents: read
concurrency:
  group: catledger-1906-consolidate-once
  cancel-in-progress: false
jobs:
  consolidate:
    if: github.repository == 'gaohongxiang/catledger'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: gaohongxiang/catledger
      RETAINED: codex/mini-1906o2-catalog-loading
      OBSOLETE: codex/mini-1906ui-entry-direct
      EXPECTED: 52127eb2a6439571f5f1216d1c09e0e84db6c337
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: 保护基线并登记文档
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$RETAINED"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          test "$(git ls-remote origin "refs/heads/$RETAINED" | cut -f1)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$EXPECTED" HEAD
          python3 - <<'PY'
          from pathlib import Path
          scopes = ['docs', 'specs', 'specs/mini-1906o-consolidated-optimization', 'specs/mini-1906ui-entry', '.github', '.github/workflows']
          for scope in scopes:
              for name in ['AGENTS.md', 'AGENTS.override.md']:
                  assert not (Path(scope) / name).exists(), f'需先读目录规则：{scope}/{name}'
          base = Path('specs/mini-1906o-consolidated-optimization')
          assert 'PERF-5' in (base / 'PERFORMANCE-CLOSURE-PLAN.md').read_text(encoding='utf-8')
          path = Path('docs/招财猫记账本实施规划.md')
          text = path.read_text(encoding='utf-8')
          heading = '### 0.5 当前任务看板\n'
          assert text.count(heading) == 1 and 'MINI-1906O-PERF｜' not in text
          block = '\nMINI-1906O-PERF｜未开始｜2026-09-13 用户要求整合两个1906任务分支并由6 Astra接手性能收口。原优化分支0a3c4263已安全快进至入口分支52127eb2；唯一后续任务分支为 `codex/mini-1906o2-catalog-loading`，入口分支不再继续开发。全部原提交保留；main保持a4e3fab7，Web归档不变。O1～O3候选及入口修复不重做；O4仍有全量响应、逐笔SQL和长事务问题，不能仅等验收。负责人待6 Astra领取后登记实际worktree，不再新建第二条远端分支。\n\n执行规格：[性能收口计划](../specs/mini-1906o-consolidated-optimization/PERFORMANCE-CLOSURE-PLAN.md)。本表是本批动态状态唯一入口；规格保存设计及验收预算。\n\n| ID | 依赖 | 状态 | 串行所有权与验收 |\n| --- | --- | --- | --- |\n'
          tasks = [
              ('0', '52127eb2完整代码基线', '6 Astra领取后冻结接口、回执、游标版本、预算和SQL/CPU测量入口'),
              ('1', 'PERF-0', 'import读取/回执/公共契约/客户端接入；小响应、摘要、服务端分页及隐藏成员门禁'),
              ('2', 'PERF-0，与PERF-1契约一致', 'review/posting/集合计算/必要迁移；分类热点、有界批量SQL、O1反例与并发'),
              ('3', 'PERF-1、PERF-2', 'import事务/回执/恢复；完整展示移出写事务，最终校验和整批原子性不减'),
              ('4', 'PERF-1', '小程序目录/草稿/页面；有限分页缓存、局部派生、能力兼容和全页面回归'),
              ('5', 'PERF-1～4', 'benchmark/CI/隔离MySQL最小权限/原生工具；性能预算与真实云端真机分开验收')]
          for task, dependency, description in tasks:
              block += f'| MINI-1906O-PERF-{task} | {dependency} | 未开始 | {description} |\n'
          block += '\n现有LOCAL-ACCEPTANCE基线：24990条账户整理457.981秒/224944次SQL，入账983.028秒/150011次SQL，用户锁983.009秒，返回61.076MB；仅本机合成数据。630项通过仅指52127eb2的历史CI run34742309047。本次登记计划不代表性能实现已完成；O5/O6发布门槛仍未关闭，O7/O8不扩入本批。每批源码、测试、文档一起提交并push同一分支；合并main、云部署/迁移、发布及真实账本操作另行授权。\n'
          text = text.replace(heading, heading + block + '\n', 1)
          h19 = '## 19. 当前下一步\n'
          assert text.count(h19) == 1
          text = text.replace(h19, h19 + '\n> 2026-09-13 当前执行覆盖说明：先按0.5的MINI-1906O-PERF-0～5在唯一优化分支收口，再完成下列既有真实业务及发布验收；不按历史“从main新建任务分支”说明重新分叉。O1～O3与入口已有候选，O4性能仍需开发。最新规格为 `specs/mini-1906o-consolidated-optimization/PERFORMANCE-CLOSURE-PLAN.md`。\n', 1)
          path.write_text(text, encoding='utf-8')
          p = base / 'README.md'
          t = p.read_text(encoding='utf-8')
          assert 'PERFORMANCE-CLOSURE-PLAN.md' not in t
          t = t.replace('## 3. 联合任务看板', '## 3. 原联合任务看板（历史，当前状态见实施规划0.5）', 1)
          banner = '> 2026-09-13 最新执行入口：[性能收口计划](PERFORMANCE-CLOSURE-PLAN.md)，交给6 Astra。\n> 唯一后续任务分支为 `codex/mini-1906o2-catalog-loading`，已包含入口分支52127eb2全部改动。O1～O3与入口已有候选；O4仍需小响应、批量SQL和短事务开发。\n> 动态状态以实施规划0.5的MINI-1906O-PERF为准。下方保留原设计与阶段历史，其中旧状态和旧菜单预取不作为当前待办。\n\n'
          p.write_text(banner + t, encoding='utf-8')
          p = base / 'CODEX-APP-HANDOFF.md'
          p.write_text('''# CatLedger：6 Astra 当前接手入口

          更新：2026-09-13。本文替代旧版“远端只有未接线catalog”的交接说明。
          唯一后续任务分支：`codex/mini-1906o2-catalog-loading`。
          完整代码基线：`52127eb2a6439571f5f1216d1c09e0e84db6c337`，已有O1～O4候选和入口兼容修复。

          ## 起步

          先读根AGENTS、实施规划0.1～0.6和第19章，再读本目录[性能收口计划](PERFORMANCE-CLOSURE-PLAN.md)与[本机验收记录](LOCAL-ACCEPTANCE.md)。不要重新泛化评估，也不要重套旧ZIP。

          先执行git status --short --branch、git worktree list、git fetch origin --prune。复用唯一任务分支的worktree；本机旧入口worktree如有未提交或未推送的独有工作，先辨认、审查整合，不能因远端名称收敛而丢弃本地工作。不reset或强制切换。

          ## 实施与交付

          按PERF-0～5串行完成契约和测量、小响应/服务端分页、集合化批量SQL、短事务/幂等恢复、客户端有界状态和逐页回归、性能门禁与原生验证。已有O1～O3修复及40项展示保留；它们不等于后端大批次性能已合格。

          中央入口现在直达记一笔，不恢复旧菜单；旧目录fallback只作兼容，不冒充新接口云端验收。

          每批源码、契约、测试和文档一起提交并push同一优化分支，不再开第二条远端任务分支。动态状态只更新实施规划0.5。历史630项通过不是本次结果。

          完整回归包含npm run check、隔离MySQL的npm run test:db、两函数生产依赖审计和性能基准。记录提交SHA、CI、字节/SQL/锁/耗时及失败/跳过。不要重写历史性能数字。

          代码稳定后再调用微信开发者工具；真机只补键盘/焦点、前后台、触摸滚动、弱网及真实云调用。没有云部署授权时先完成本地实现，明确剩余环境门槛；mock不能代替新接口云端验收。

          不force push，不reset main，不动Web归档，不改真实账本。不合并main、不部署函数、不迁移云数据库、不上传发布或修改云权限，除非用户另行授权。
          '''.replace('\n          ', '\n'), encoding='utf-8')
          p = Path('specs/mini-1906ui-entry/README.md')
          t = p.read_text(encoding='utf-8')
          banner = '> 2026-09-13 分支整合：本任务52127eb2全部代码已快进纳入 `codex/mini-1906o2-catalog-loading`；不再在旧入口分支开发。下文分支/worktree为历史证据，本机未提交工作另行核对，不能自动删除。后续见[性能收口计划](../mini-1906o-consolidated-optimization/PERFORMANCE-CLOSURE-PLAN.md)。\n\n'
          p.write_text(banner + t, encoding='utf-8')
          print('仅更新4份计划/交接文档；运行时源码及历史验收数据未改动。')
          PY
          git diff --check
          git add -- 'docs/招财猫记账本实施规划.md' 'specs/mini-1906o-consolidated-optimization/README.md' 'specs/mini-1906o-consolidated-optimization/CODEX-APP-HANDOFF.md' 'specs/mini-1906ui-entry/README.md'
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'docs(1906): 统一当前看板和6 Astra交接入口'
          git push origin "HEAD:refs/heads/$RETAINED"
      - name: 仅清理已完整包含且没有新提交的入口分支
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$REPO/git/ref/heads/main" --jq '.object.sha')" = 'a4e3fab7333ce5a52aa05c6902155e4c69757d5e'
          test "$(gh api "repos/$REPO/git/ref/heads/catledger-web" --jq '.object.sha')" = '39a0ea55ca39e27c62fc83f2ae83012358ca8373'
          actual=$(gh api "repos/$REPO/git/ref/heads/$OBSOLETE" --jq '.object.sha')
          test "$actual" = "$EXPECTED"
          retained=$(gh api "repos/$REPO/git/ref/heads/$RETAINED" --jq '.object.sha')
          comparison=$(gh api "repos/$REPO/compare/$EXPECTED...$retained" --jq '.status')
          test "$comparison" = 'ahead' -o "$comparison" = 'identical'
          prs=$(gh api "repos/$REPO/pulls?state=open&head=gaohongxiang:$OBSOLETE" --jq 'length')
          test "$prs" = '0'
          gh api --method DELETE "repos/$REPO/git/refs/heads/$OBSOLETE"
          echo "已保留全部入口提交并删除冗余分支：$OBSOLETE"
          gh api "repos/$REPO/branches?per_page=100" --jq '.[] | [.name, .commit.sha] | @tsv'
