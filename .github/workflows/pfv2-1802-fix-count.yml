name: PFV2-1802 Fix Reparse Count

on:
  push:
    branches:
      - codex/pfv2-1802-source-identity
    paths:
      - .github/workflows/pfv2-1802-fix-count.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pfv2-1802-fix-count
  cancel-in-progress: false

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v6
        with:
          ref: codex/pfv2-1802-source-identity
          fetch-depth: 0

      - name: Correct the reparse aggregate expectation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('pkg/personalfinance/importing/dedup_service_sqlite_test.go')
          content = path.read_text()
          old = 'assertDedupBatchCounts(t, secondBatch, 6, 5, 1, 2, 1, 5)'
          new = 'assertDedupBatchCounts(t, secondBatch, 6, 5, 1, 3, 1, 5)'
          if content.count(old) != 1:
              raise SystemExit(f'expected exactly one old assertion, found {content.count(old)}')
          path.write_text(content.replace(old, new))
          PY
          git diff --check

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test importing and organizer
        run: go test -count=1 ./pkg/personalfinance/importing ./pkg/personalfinance/organizer

      - name: Vet importing and organizer
        run: go vet ./pkg/personalfinance/importing ./pkg/personalfinance/organizer

      - name: Repeat identity and multiplicity regressions
        run: go test -count=10 -run 'TestDedupServicePreservesIdenticalPhysicalRowsWithoutStableIdentifiers|TestBuildOrganizePlanSplitsLegacyV1ContentFingerprintRows|TestBuildOrganizePlanKeepsLegacyV1StableTransactionIdentity|TestBuildOrganizePlanPreservesMultiplicityAcrossTwoByTwoSources' ./pkg/personalfinance/importing ./pkg/personalfinance/organizer

      - name: Commit verified correction and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/pfv2-1802-fix-count.yml
          git add pkg/personalfinance/importing/dedup_service_sqlite_test.go
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(pf): count all confirmed reparse observations'
          git push origin HEAD:codex/pfv2-1802-source-identity
