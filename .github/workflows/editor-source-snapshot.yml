name: Editor source snapshot
on:
  push:
    branches: [main]
    paths: [.github/workflows/editor-source-snapshot.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm ci --ignore-scripts --prefix cloudfunctions/catledger-api
      - run: npm ci --ignore-scripts --prefix cloudfunctions/catledger-import
      - name: Archive tracked source and public dependencies for isolated validation
        run: |
          git archive --format=tar HEAD -o "$RUNNER_TEMP/catledger-editor-source.tar"
          tar -rf "$RUNNER_TEMP/catledger-editor-source.tar" cloudfunctions/catledger-api/node_modules cloudfunctions/catledger-import/node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: catledger-editor-source
          path: ${{ runner.temp }}/catledger-editor-source.tar
          retention-days: 1
