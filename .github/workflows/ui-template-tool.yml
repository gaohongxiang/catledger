name: UI 模板检查工具
on:
  push:
    branches: [codex/mini-1906ui-all-pages]
    paths: [.github/workflows/ui-template-tool.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: 安装固定版本的离线模板检查工具
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/template-tool"
          npm install --prefix "$RUNNER_TEMP/template-tool" --ignore-scripts --no-audit --no-fund miniprogram-compiler@0.2.3
          tar -czf "$RUNNER_TEMP/template-tool.tar.gz" -C "$RUNNER_TEMP/template-tool" .
      - uses: actions/upload-artifact@v4
        with:
          name: ui-template-tool
          path: ${{ runner.temp }}/template-tool.tar.gz
          retention-days: 1
          if-no-files-found: error
