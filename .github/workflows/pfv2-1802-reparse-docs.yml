name: PFV2-1802 Reparse Compatibility Docs

on:
  push:
    branches:
      - codex/pfv2-1802-reparse-compat

permissions:
  contents: write

jobs:
  apply-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v6
        with:
          ref: codex/pfv2-1802-reparse-compat
          fetch-depth: 0

      - name: Freeze compatibility contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          design = "docs/个人财务来源记录身份与重复语义设计.md"
          replace_once(
              design,
              "> 状态：DESIGN-1802 冻结设计；PFV2-1802 已实现，等待合并与真实数据验收",
              "> 状态：DESIGN-1802 冻结设计；PFV2-1802 已集成并发布；重解析物理身份兼容修正已冻结、待实现",
          )
          replace_once(
              design,
              "- 同一文件的同一物理行重解析，仍是同一来源记录；",
              "- 同一文件的同一物理行重解析，仍是同一来源记录；即使解析器升级后新提取出稳定交易号，也不得把同一物理记录拆成两个事件；",
          )
          replace_once(
              design,
              "3. 旧 v1 稳定交易号和完整订单组合继续按来源身份归组。\n4. 未入账更新通过 UX-1801 放弃旧轮并选择原批次创建新轮；新轮按修正规则重建事件和问题。\n5. 已入账正式交易不自动重写。若以后发现历史缺失事件，只生成可审计的补充候选并等待用户授权。\n6. 不删除旧 `SourceIdentity`、原始行或动作历史；旧强指纹身份作为历史事实保留但不再决定新事件数量。",
              "3. 旧 v1 稳定交易号和完整订单组合继续按来源身份归组。\n4. 旧 v1、v2 或解析器升级后的记录，只要属于同一用户、来源类型、来源账户、文件和 locator，就必须先复用同一物理观察；新提取出的稳定交易号只升级身份解释，不增加事件数量。\n5. 未入账更新通过 UX-1801 放弃旧轮并选择显式重解析后的批次创建新轮；新轮按修正规则重建事件和问题。\n6. 已入账正式交易不自动重写。若以后发现历史缺失事件，只生成可审计的补充候选并等待用户授权。\n7. 不删除旧 `SourceIdentity`、原始行或动作历史；旧强指纹身份作为历史事实保留但不再决定新事件数量。",
          )
          replace_once(
              design,
              "| 同一文件同一 locator 显式重解析 | 复用来源身份，作为同一来源记录再次观察 |",
              "| 同一文件同一 locator 显式重解析 | 一个事件、多条观察证据，不因批次或行 ID 变化新增事件 |\n| 旧 identity-v1 同一 locator 重解析 | 仍复用同一物理观察，不因旧行 ID 不同新增事件 |\n| 同一 locator 重解析后新增稳定交易号 | 只升级身份解释，仍保持一个事件 |",
          )

          rules = "docs/个人财务业务规则与验收.md"
          replace_once(
              rules,
              "- 同一文件同一物理定位的显式重解析复用来源身份；不同文件中的相同内容在无稳定标识时默认独立；",
              "- 同一文件、同一来源账户、同一物理定位的显式重解析复用来源身份；解析器升级或新提取稳定交易号不得把同一物理记录拆成多个事件；不同文件中的相同内容在无稳定标识时默认独立；",
          )
          replace_once(
              rules,
              "- 无稳定来源标识时，只有同一文件内容与同一物理 locator 才能确认是同一来源记录；",
              "- 无稳定来源标识时，只有同一用户、来源类型、来源账户、文件内容与物理 locator 才能确认是同一来源记录；该物理观察边界跨旧 v1、v2 和解析器版本保持稳定；",
          )
          replace_once(
              rules,
              "| 同一文件同一物理行显式重解析 | 复用来源身份，不新增经济效果 |",
              "| 同一文件同一物理行显式重解析 | 复用来源身份，不新增经济效果 |\n| 旧 identity-v1 同一 locator 重解析 | 仍复用同一物理观察，不因旧行 ID 不同新增事件 |\n| 同一 locator 重解析后新增稳定交易号 | 只升级身份解释，仍保持一个事件 |",
          )

          architecture = "docs/个人财务架构设计.md"
          replace_once(
              architecture,
              "证据包含原文件、解析批次、原始行、来源身份和物理定位。原始行按多重集保存；同一文件的不同物理定位永远是不同证据观察。来源身份只由稳定来源标识或文件内容与物理定位确定，内容指纹不承担身份。证据不可变、可版本化、可追溯，但不直接产生余额。",
              "证据包含原文件、解析批次、原始行、来源身份和物理定位。原始行按多重集保存；同一文件的不同物理定位永远是不同证据观察。来源身份只由稳定来源标识或文件内容与物理定位确定，内容指纹不承担身份。整理器在使用持久来源身份或跨来源候选前，先按用户、来源类型、来源账户、文件和 locator 统一同一物理观察；解析版本变化或新提取稳定交易号不得改变该物理身份。证据不可变、可版本化、可追溯，但不直接产生余额。",
          )
          replace_once(
              architecture,
              "后台顺序保留为：文件防重 → 解析留证 → 账户解释 → 来源记录身份裁决 → 保留完整来源记录多重集 → 跨来源一对一同一事件匹配 → 经济性质和关系 → 分类 → 可入账事件 → 待处理。内容签名只能生成候选，不得在跨来源核对前减少记录数量。",
              "后台顺序保留为：文件防重 → 解析留证 → 账户解释 → 来源记录身份裁决 → 同一物理观察跨重解析归并 → 保留完整来源记录多重集 → 跨来源一对一同一事件匹配 → 经济性质和关系 → 分类 → 可入账事件 → 待处理。内容签名只能生成候选，不得在跨来源核对前减少记录数量；同一 locator 的身份解释升级也不得新增事件。",
          )

          planning = "docs/个人财务实施规划.md"
          replace_once(
              planning,
              "| PFV2-1802 | 修复无流水号来源身份与相同内容交易误合并 | UX-1801 | 待验收 | 当前主负责人 / `main` | `b5987979` 冻结 DESIGN-1802，`078112ff` 实现 identity-v2 与旧 v1 兼容拆分，`c8e46ed5` 修正重解析汇总金标，`48411056` 集成并发布；发布门禁通过 Go 全量、前端 38,651 项单测与生产构建，8080 重启验证通过；不改 schema、正式交易或生产数据，等待新轮真实数据验收 |",
              "| PFV2-1802 | 修复无流水号来源身份与相同内容交易误合并 | UX-1801 | 进行中 | 当前主负责人 / `codex/pfv2-1802-reparse-compat` | `48411056` 已集成并发布 identity-v2；独立审查发现旧 v1 同一 locator 重解析及解析器新增稳定交易号时，整理器仍可能因行身份版本变化生成两个事件。本分支先冻结同一物理观察跨版本复用契约，再补实现与回归；不改 schema、正式交易或生产数据 |",
          )
          PY
          git diff --check

      - name: Commit design before implementation
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            docs/个人财务来源记录身份与重复语义设计.md \
            docs/个人财务业务规则与验收.md \
            docs/个人财务架构设计.md \
            docs/个人财务实施规划.md
          git rm .github/workflows/pfv2-1802-reparse-docs.yml
          git commit -m 'docs(pf): freeze physical identity across reparses'
          git push origin HEAD:codex/pfv2-1802-reparse-compat
