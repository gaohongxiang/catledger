name: 全页面最终整合验证
on:
  push:
    branches: [codex/mini-1906ui-all-pages]
    paths: [.github/workflows/ui-all-verify.yml]
permissions:
  contents: write
jobs:
  verify-and-publish:
    if: github.ref == 'refs/heads/codex/mini-1906ui-all-pages'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: local-synthetic-ci-only
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: catledger_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: codex/mini-1906ui-all-pages
      SOURCE_BASE: 512cd6f213e19f907d1510b8bd14f711d91afead
      PR7_HEAD: 3344cf42ef242fcd3e4dc525ae4100416000e9fe
      MAIN_BASE: 1b37788ced1b3ca4cdf4f8a9275bc94db2ec6f62
      EXPECTED_TREE: 598910abf84cd7b29dba88e54321ef33cb199f10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: 还原确定候选并校验每个文件和完整树
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ui-final-results"
          git switch --detach "$SOURCE_BASE"
          python3 - <<'PY'
          import base64, bz2, hashlib, json, os, pathlib, re, subprocess
          blobs = ['b40a082a22d416d003597b71b0787639ec306e18', '9e16f5cce598dc39ef60f7b06fc1b861ab08d361', 'cdf13542a37faf32ee3a0996474f50766cc22cc0', '3e7fc94a267d140675fae6e2e013267fce41a69d']
          chunks = []
          for sha in blobs:
              result = json.loads(subprocess.check_output(['gh', 'api', 'repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/blobs/' + sha]))
              chunk = base64.b64decode(result['content'])
              assert hashlib.sha1(b'blob ' + str(len(chunk)).encode() + b'\0' + chunk).hexdigest() == sha
              chunks.append(chunk)
          data = bz2.decompress(base64.b64decode(b''.join(chunks), validate=True))
          assert hashlib.sha256(data).hexdigest() == '922b21852d2c43906ae7c7f99f913fb3cd3801c65f813c846d5410227060da75'
          entries = json.loads(data)
          assert len(entries) == 67
          def clean(m):
              declarations = [x.strip() for x in m.group(1).split(';') if x.strip()]
              if not declarations or any(':' not in x for x in declarations): return m.group()
              last = {x.split(':', 1)[0].strip(): i for i, x in enumerate(declarations)}
              declarations = [x for i, x in enumerate(declarations) if last[x.split(':', 1)[0].strip()] == i]
              return '{ ' + '; '.join(declarations) + '; }' if len(declarations) <= 3 else '{\n' + ''.join('  ' + x + ';\n' for x in declarations) + '}'
          def normalize_css(text):
              return '\n'.join(x.rstrip() for x in re.sub(r'\{([^{}]*)\}', clean, text).splitlines()) + '\n'
          seen = set()
          for entry in entries:
              name = entry['path']
              p = pathlib.PurePosixPath(name)
              assert not p.is_absolute() and '..' not in p.parts and name not in seen
              assert name.startswith(('miniprogram/', 'docs/', 'specs/', 'test/')) or name == 'scripts/check-ui-templates.js'
              assert not name.endswith('/model.js') and not name.startswith('miniprogram/services/')
              seen.add(name)
              target = pathlib.Path(name)
              if entry['old'] is None:
                  assert not target.exists()
                  original = b''
              else:
                  original = target.read_bytes()
                  assert hashlib.sha256(original).hexdigest() == entry['old'], name
              text = original.decode('utf-8')
              if entry['css']: text = normalize_css(text)
              lines = text.splitlines(keepends=True)
              for start, end, replacement in reversed(entry['edits']):
                  assert 0 <= start <= end <= len(lines), name
                  lines[start:end] = [replacement]
              output = ''.join(lines).encode('utf-8')
              assert hashlib.sha256(output).hexdigest() == entry['new'], name
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(output)
          subprocess.run(['git', 'add', '--', *sorted(seen)], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          assert tree == os.environ['EXPECTED_TREE'], tree
          names = subprocess.check_output(['git', 'diff', '--name-only', os.environ['MAIN_BASE'], tree], text=True).splitlines()
          assert not any(n.startswith(('cloudfunctions/', 'shared/', 'migrations/', 'miniprogram/services/')) or n.endswith('/model.js') for n in names)
          assert not any(n.startswith('.github/') for n in names)
          pathlib.Path(os.environ['RUNNER_TEMP'], 'ui-final-results', 'candidate.json').write_text(json.dumps({'tree': tree, 'changedFromPr8': len(entries), 'protectedPathsUnchanged': True}, indent=2))
          print('完整候选树匹配；67 个指定文件已校验；后端、契约和原有 CI 不变。')
          PY
      - run: npm ci --prefix cloudfunctions/catledger-api
      - run: npm ci --prefix cloudfunctions/catledger-import
      - name: 静态检查
        shell: bash
        run: npm run check | tee "$RUNNER_TEMP/ui-final-results/check.log"
      - name: Node18和MySQL8.4全量回归
        shell: bash
        env:
          CATLEDGER_TEST_DB_HOST: 127.0.0.1
          CATLEDGER_TEST_DB_PORT: 3306
          CATLEDGER_TEST_DB_USER: root
          CATLEDGER_TEST_DB_PASSWORD: local-synthetic-ci-only
          CATLEDGER_TEST_DB_NAME: catledger_test
        run: npm run test:db | tee "$RUNNER_TEMP/ui-final-results/test.log"
      - name: 生产依赖审计
        shell: bash
        run: |
          npm run audit:prod --prefix cloudfunctions/catledger-api | tee "$RUNNER_TEMP/ui-final-results/api-audit.log"
          npm run audit:prod --prefix cloudfunctions/catledger-import | tee "$RUNNER_TEMP/ui-final-results/import-audit.log"
      - name: WXML和WXSS离线编译
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/template-tool" --ignore-scripts --no-audit --no-fund miniprogram-compiler@0.2.3
          node scripts/check-ui-templates.js "$RUNNER_TEMP/template-tool/node_modules/miniprogram-compiler" | tee "$RUNNER_TEMP/ui-final-results/templates.log"
      - name: 仅发布已验证的新分支，保留两个PR历史
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, subprocess
          env = os.environ.copy()
          env['GIT_TERMINAL_PROMPT'] = '0'
          env['GIT_CONFIG_COUNT'] = '1'
          env['GIT_CONFIG_KEY_0'] = 'http.https://github.com/.extraheader'
          env['GIT_CONFIG_VALUE_0'] = 'AUTHORIZATION: basic ' + base64.b64encode(('x-access-token:' + env['GH_TOKEN']).encode()).decode()
          branch = env['TARGET_BRANCH']
          assert branch == 'codex/mini-1906ui-all-pages'
          remote = subprocess.check_output(['git', 'ls-remote', 'origin', 'refs/heads/' + branch], env=env, text=True).split()[0]
          assert remote == env['GITHUB_SHA'], '远端分支已有其他改动，停止发布'
          subprocess.run(['git', 'fetch', '--no-tags', 'origin', env['PR7_HEAD']], env=env, check=True)
          assert subprocess.check_output(['git', 'write-tree'], text=True).strip() == env['EXPECTED_TREE']
          env.update({'GIT_AUTHOR_NAME': 'catledger UI integration', 'GIT_AUTHOR_EMAIL': '41898282+github-actions[bot]@users.noreply.github.com', 'GIT_COMMITTER_NAME': 'catledger UI integration', 'GIT_COMMITTER_EMAIL': '41898282+github-actions[bot]@users.noreply.github.com'})
          message = 'feat(ui): 统一全部11页面并整合两个界面候选\n\n保留PR8三项同行账户布局，吸收PR7文件继续、付款提示及证据展开；统一六主题排版、所有页面和弹层。\n\n候选树摘要、Node18/MySQL8.4全量回归、生产依赖审计和wcc/wcsc离线编译通过。未执行微信真机验收，不合并main、不部署、不新建PR。\n'
          commit = subprocess.check_output(['git', 'commit-tree', env['EXPECTED_TREE'], '-p', env['GITHUB_SHA'], '-p', env['PR7_HEAD']], input=message, text=True, env=env).strip()
          subprocess.run(['git', 'push', 'origin', commit + ':refs/heads/' + branch], env=env, check=True)
          pathlib.Path(env['RUNNER_TEMP'], 'ui-final-results', 'published.json').write_text(json.dumps({'commit': commit, 'tree': env['EXPECTED_TREE'], 'branch': branch, 'pr7': env['PR7_HEAD'], 'pr8': env['SOURCE_BASE'], 'workflowParent': env['GITHUB_SHA']}, indent=2))
          print('已推送指定分支：' + branch + ' @ ' + commit)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-all-final-validation
          path: ${{ runner.temp }}/ui-final-results/
          retention-days: 7
          if-no-files-found: error
