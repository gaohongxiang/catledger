name: 账户同行反馈验证
on:
  push:
    branches: [codex/mini-1906ui-import-refinement]
    paths: [.github/workflows/ui-account-compact-review.yml]
permissions:
  contents: write
jobs:
  verify:
    if: github.ref == 'refs/heads/codex/mini-1906ui-import-refinement'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: local-synthetic-ci-only
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: catledger_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: 还原八个指定文件并检查源码树
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, zlib
          encoded = '?'
          PY
