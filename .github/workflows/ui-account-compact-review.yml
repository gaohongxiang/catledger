          for item in delta['changes']:
              path = pathlib.Path(item['path'])
              assert not path.is_symlink()
              if item['before'] is None:
                  assert not path.exists()
                  old = b''
              else:
                  old = path.read_bytes()
                  assert blob(old) == item['before'], item['path']
              lines = old.decode().splitlines(keepends=True)
              for start, count, replacement in reversed(item['edits']):
                  assert 0 <= start <= len(lines) and 0 <= count <= len(lines)-start
                  lines[start:start+count] = replacement.splitlines(keepends=True)
              new = ''.join(lines).encode()
              assert blob(new) == item['after'], item['path']
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(new)
          temporary = '.github/workflows/ui-account-compact-review.yml'
          pathlib.Path(temporary).unlink()
          subprocess.run(['git','add','--',*sorted(allowed),temporary],check=True)
          tree = subprocess.check_output(['git','write-tree'],text=True).strip()
          assert tree == delta['tree'] == '8cf6ae2a06e5afa5ffab912bb2ac6d87797f422a'
          pathlib.Path(os.environ['RUNNER_TEMP'],'account-delta.json').write_bytes(raw)
          print('Exact account-layout candidate verified:',tree)
          PY
      - run: npm ci --prefix cloudfunctions/catledger-api
