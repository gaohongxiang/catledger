name: PFV2-1802 Apply Patches

on:
  push:
    branches:
      - codex/pfv2-1802-source-identity
    paths:
      - .github/pfv2-1802-patches/**
      - .github/workflows/pfv2-1802-apply.yml
  pull_request:
    branches:
      - codex/ux-1801-abandon-round
    paths:
      - .github/pfv2-1802-patches/**
      - .github/workflows/pfv2-1802-apply.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pfv2-1802-apply
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v6
        with:
          ref: codex/pfv2-1802-source-identity
          fetch-depth: 0

      - name: Apply reviewed patches and remove temporary applier
        shell: bash
        run: |
          shopt -s nullglob
          patches=(.github/pfv2-1802-patches/*.patch)
          test "${#patches[@]}" -eq 13
          for patch in "${patches[@]}"; do
            git apply --check "$patch"
          done
          for patch in "${patches[@]}"; do
            git apply --index "$patch"
          done
          git rm -r .github/pfv2-1802-patches .github/workflows/pfv2-1802-apply.yml
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(pf): preserve physical source records without stable ids'
          git push origin HEAD:codex/pfv2-1802-source-identity
