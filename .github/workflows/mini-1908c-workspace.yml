name: MINI-1908C isolated verification and commit
on:
  push:
    branches: [codex/mini-1908c-repayment-link]
    paths: [.github/workflows/mini-1908c-workspace.yml]
permissions:
  contents: write
jobs:
  verify-and-commit:
    if: github.repository == 'gaohongxiang/catledger' && github.ref == 'refs/heads/codex/mini-1908c-repayment-link'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: local-synthetic-ci-only
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: catledger_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Apply checksum-verified source edits
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, pathlib, subprocess
          payload = ''.join(''.join(pathlib.Path('.github/mini-1908c.payload.' + str(i)).read_text().split()) for i in (1, 2))
          raw = lzma.decompress(base64.b64decode(payload, validate=True))
          assert hashlib.sha256(raw).hexdigest() == 'ff5c42ed25dd4d3c99d3f4a5bd1560a02f9d7bcef3d0d7186b0d1e7f0b454d01', 'Source bundle checksum mismatch'
          entries = json.loads(raw)
          assert len(entries) == 36
          seen = set()
          for entry in entries:
              name = entry['path']
              path = pathlib.Path(name)
              assert not path.is_absolute() and '..' not in path.parts
              assert path.parts[0] in ('cloudfunctions', 'miniprogram', 'shared', 'test', 'specs', 'docs')
              assert not any(p in ('.git', 'node_modules') or p.startswith('AGENTS') for p in path.parts)
              assert name not in seen and not path.is_symlink()
              seen.add(name)
              before = path.read_bytes() if path.exists() else None
              assert (hashlib.sha256(before).hexdigest() if before is not None else None) == entry['before'], 'Changed base: ' + name
              lines = (before or b'').decode('utf-8').splitlines(keepends=True)
              last = len(lines) + 1
              for start, end, replacement in reversed(entry['edits']):
                  assert 0 <= start <= end < last and end <= len(lines)
                  lines[start:end] = [replacement]
                  last = start + 1
              after = ''.join(lines).encode('utf-8')
              assert hashlib.sha256(after).hexdigest() == entry['after'], 'Changed output: ' + name
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(after)
              subprocess.run(['git', 'add', '--', name], check=True)
          print('Verified and applied 36 source/test/document files')
          PY
          git rm -- .github/mini-1908c.payload.1 .github/mini-1908c.payload.2 .github/workflows/mini-1908c-workspace.yml
          git diff --cached --check
      - run: npm ci --prefix cloudfunctions/catledger-api
      - run: npm ci --prefix cloudfunctions/catledger-import
      - name: Static validation
        run: npm run check
      - name: Full repository and isolated database regression
        shell: bash
        env:
          CATLEDGER_TEST_DB_HOST: 127.0.0.1
          CATLEDGER_TEST_DB_PORT: 3306
          CATLEDGER_TEST_DB_USER: root
          CATLEDGER_TEST_DB_PASSWORD: local-synthetic-ci-only
          CATLEDGER_TEST_DB_NAME: catledger_test
        run: |
          set -o pipefail
          npm run test:db 2>&1 | tee /tmp/mini-1908c-test.log
      - run: npm run audit:prod --prefix cloudfunctions/catledger-api
      - run: npm run audit:prod --prefix cloudfunctions/catledger-import
      - name: Record verified scope and commit task branch only
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib
          path = pathlib.Path('docs/招财猫记账本实施规划.md')
          text = path.read_text()
          assert text.count('MINI-1908C｜进行中｜') == 1
          text = text.replace('MINI-1908C｜进行中｜', 'MINI-1908C｜待验收｜', 1)
          url = 'https://github.com/gaohongxiang/catledger/actions/runs/' + os.environ['GITHUB_RUN_ID']
          text += '\n\nMINI-1908C 隔离 CI 验证：' + url + ' 。完整 Git 历史、Node 18、一次性 MySQL 8.4 下 `npm run check`、`npm run test:db` 及两支函数生产依赖审计通过；新增数据库回归包含来源关联不扣第二次款、整组更正/撤销、原始单据续接、跨用户隔离、期次部分分配与分页。此记录和功能同批提交到独立任务分支；未合入 main、未部署云函数、未上传小程序，微信开发者工具与真机验收仍待完成。临时源码搬运文件和工作流从候选树中移除。\n'
          path.write_text(text)
          PY
          git add -- docs/招财猫记账本实施规划.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(loans): connect bill repayments to installment details and reconciliation'
          git push origin HEAD:refs/heads/codex/mini-1908c-repayment-link
          git rev-parse HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mini-1908c-test-log
          path: /tmp/mini-1908c-test.log
          retention-days: 3
          if-no-files-found: ignore
