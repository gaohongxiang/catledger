name: PF v2 Apply Release Gate Fixes

on:
  push:
    branches:
      - codex/pfv2-1702-review-issues

permissions:
  contents: write

concurrency:
  group: pfv2-apply-release-gate-fixes
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v6
        with:
          ref: codex/pfv2-1702-review-issues
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Apply verified fixes
        shell: bash
        run: |
          printf '%s' '' | base64 -d > /tmp/pfv2-fixes.patch.gz
          echo 'fe133b47d5184e460eba5818fd28b1a103760438ea5fb6cfdc6f78ff55864e4b  /tmp/pfv2-fixes.patch.gz' | sha256sum --check
          gzip -dc /tmp/pfv2-fixes.patch.gz > /tmp/pfv2-fixes.patch
          git apply --check /tmp/pfv2-fixes.patch
          git apply /tmp/pfv2-fixes.patch
          gofmt -w \
            pkg/personalfinance/migrations/schema_v010_live_test.go \
            pkg/personalfinance/reconciliation/decision_repository.go
          git rm -f .github/workflows/pfv2-apply-fixes.yml
          git diff --check

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(pf): close full release gate failures'
          git push origin HEAD:codex/pfv2-1702-review-issues
