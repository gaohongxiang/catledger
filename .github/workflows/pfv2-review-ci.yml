name: PF v2 Full Release Gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: pfv2-full-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Go full, vet, race and repeat
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify changed Go formatting
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          files=$(git diff --name-only --diff-filter=ACMRT "$base"...HEAD -- '*.go')
          if [ -n "$files" ]; then
            unformatted=$(gofmt -l $files)
            if [ -n "$unformatted" ]; then
              printf 'Unformatted Go files:\n%s\n' "$unformatted"
              exit 1
            fi
          fi

      - name: Run complete Go test suite
        run: go test -count=1 ./...

      - name: Run Go vet
        run: go vet ./...

      - name: Run race detector on critical PF packages
        run: go test -race -count=1 ./pkg/personalfinance/organizer ./pkg/personalfinance/migrations ./pkg/api

      - name: Repeat organizer suite for determinism
        run: go test -count=10 ./pkg/personalfinance/organizer

  frontend:
    name: Frontend type, lint, unit and production build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type-check Vue and TypeScript
        run: ./node_modules/.bin/vue-tsc --noEmit

      - name: Run lint when configured
        shell: bash
        run: |
          if node -e "process.exit(require('./package.json').scripts?.lint ? 0 : 1)"; then
            npm run lint
          elif [ -x ./node_modules/.bin/eslint ]; then
            ./node_modules/.bin/eslint src
          else
            echo 'No lint command is configured; skipped.'
          fi

      - name: Run unit tests
        shell: bash
        run: |
          if [ -x ./node_modules/.bin/vitest ]; then
            ./node_modules/.bin/vitest run
          elif [ -x ./node_modules/.bin/jest ]; then
            ./node_modules/.bin/jest --runInBand
          elif node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            npm test -- --run
          else
            echo 'No supported unit-test runner is configured; skipped.'
          fi

      - name: Build production frontend
        shell: bash
        run: |
          if node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then
            npm run build
          else
            echo 'No build script is configured.'
            exit 1
          fi

  mysql-v010:
    name: MySQL 8.4 live v010 migration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ezbookkeeping
          MYSQL_DATABASE: ezbookkeeping_pf_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --silent || mysqladmin ping -h 127.0.0.1 -pezbookkeeping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Exercise complete migration chain and restart
        env:
          PF_LIVE_DB_TYPE: mysql
          PF_LIVE_DB_HOST: 127.0.0.1
          PF_LIVE_DB_PORT: '3306'
          PF_LIVE_DB_NAME: ezbookkeeping_pf_test
          PF_LIVE_DB_USER: root
          PF_LIVE_DB_PASSWORD: ezbookkeeping
          PF_LIVE_DB_SSL_MODE: disable
        run: go test -count=1 -run '^TestSchemaV010LiveDatabaseUpgrade$' ./pkg/personalfinance/migrations

  postgres-v010:
    name: PostgreSQL 17 live v010 migration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ezbookkeeping
          POSTGRES_DB: ezbookkeeping_pf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d ezbookkeeping_pf_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Exercise complete migration chain and restart
        env:
          PF_LIVE_DB_TYPE: postgresql
          PF_LIVE_DB_HOST: 127.0.0.1
          PF_LIVE_DB_PORT: '5432'
          PF_LIVE_DB_NAME: ezbookkeeping_pf_test
          PF_LIVE_DB_USER: postgres
          PF_LIVE_DB_PASSWORD: ezbookkeeping
          PF_LIVE_DB_SSL_MODE: disable
        run: go test -count=1 -run '^TestSchemaV010LiveDatabaseUpgrade$' ./pkg/personalfinance/migrations

  finalize:
    name: Clean temporary tooling and publish review-ready PR
    needs:
      - backend
      - frontend
      - mysql-v010
      - postgres-v010
    if: ${{ success() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Remove temporary verification workflows
        id: cleanup
        shell: bash
        run: |
          git rm -f --ignore-unmatch \
            .github/workflows/pfv2-toolchain.yml \
            .github/workflows/pfv2-dependencies.yml \
            .github/workflows/pfv2-source-snapshot.yml
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'chore(pf): remove temporary verification workflows'
          git push origin "HEAD:${{ github.head_ref }}"
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Publish final PR metadata
        if: steps.cleanup.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          cat > /tmp/pr-body.md <<'EOF'
          ## 目标

          落实 DESIGN-1701，将个人财务“必须处理”从视觉相似事件列表升级为稳定、可审计的问题工作台，并补齐同一经济事件、退款、已有交易、服务端可入账校验及报表会计语义。

          ## 核心结果

          - `ReviewIssue` / `ReviewIssueMember` 稳定投影与 v010 迁移；
          - 相同答案原子批量应用，但保留每笔独立事件身份；
          - 同一笔、多笔独立、无效证据、关联已有交易的显式裁决；
          - 当前、历史与正式账本范围的退款关系处理及累计金额约束；
          - `ready` 完全由服务端统一校验派生，posting 在同一事务内复验；
          - 退款冲减消费，借款不计收入，本金偿还不计消费；
          - 桌面端与移动端问题工作台、证据查看和关系选择体验；
          - 文档、现行说明、业务边界和验收矩阵同步更新。

          ## 发布门禁

          - `go test -count=1 ./...`
          - `go vet ./...`
          - 关键个人财务包 race detector
          - organizer 测试重复运行 10 次
          - Vue / TypeScript 类型检查、lint、单元测试、生产构建
          - SQLite 测试链
          - MySQL 8.4 实际 v001 → v010 迁移与重复启动
          - PostgreSQL 17 实际 v001 → v010 迁移与重复启动

          ## 安全边界

          本 PR 不自动执行正式入账；合并和部署前仍需对正式数据做一致性备份，并先在隔离副本验证问题数量、数据守恒、退款口径、入账、重放、重启和撤销。
          EOF
          gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --title 'feat(pf): 重构待处理问题与关系裁决' \
            --body-file /tmp/pr-body.md
          gh pr ready "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
            '全量发布门禁已通过：全仓 Go 测试、vet、关键 race/repeat、前端类型/lint/单测/构建，以及 MySQL 8.4 与 PostgreSQL 17 的真实 v010 迁移验证均成功。临时验证工作流已清理，PR 已进入可评审状态。'
