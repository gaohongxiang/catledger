name: PF Review Checks

on:
  push:
    branches:
      - codex/pfv2-1702-review-issues
    paths:
      - 'pkg/personalfinance/**'
      - 'pkg/api/**'
      - 'src/features/personal-finance/**'
      - 'go.mod'
      - 'go.sum'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/pfv2-review-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'pkg/personalfinance/**'
      - 'pkg/api/**'
      - 'src/features/personal-finance/**'
      - 'go.mod'
      - 'go.sum'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/pfv2-review-ci.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pf-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        id: format
        continue-on-error: true
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git merge-base HEAD origin/main)"
          fi
          files=$(git diff --name-only --diff-filter=ACMRT "$base"...HEAD -- '*.go')
          if [ -n "$files" ]; then
            unformatted=$(gofmt -l $files)
            if [ -n "$unformatted" ]; then
              printf 'Unformatted Go files:\n%s\n' "$unformatted"
              exit 1
            fi
          fi

      - name: Test personal finance backend
        id: backend_tests
        continue-on-error: true
        run: go test ./pkg/personalfinance/... ./pkg/api/...

      - name: Type-check frontend
        id: frontend_typecheck
        continue-on-error: true
        run: npx vue-tsc --noEmit

      - name: Report result on draft PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          FORMAT_OUTCOME: ${{ steps.format.outcome }}
          BACKEND_OUTCOME: ${{ steps.backend_tests.outcome }}
          FRONTEND_OUTCOME: ${{ steps.frontend_typecheck.outcome }}
        shell: bash
        run: |
          cat > /tmp/pf-review-result.md <<EOF
          <!-- pf-review-check-result -->
          ### PF Review Checks

          Commit: \`${GITHUB_SHA}\`

          - Go formatting: **${FORMAT_OUTCOME}**
          - Personal-finance backend tests: **${BACKEND_OUTCOME}**
          - Vue/TypeScript type-check: **${FRONTEND_OUTCOME}**
          EOF
          gh pr comment 1 --repo "${GITHUB_REPOSITORY}" --body-file /tmp/pf-review-result.md

      - name: Enforce checks
        if: always()
        env:
          FORMAT_OUTCOME: ${{ steps.format.outcome }}
          BACKEND_OUTCOME: ${{ steps.backend_tests.outcome }}
          FRONTEND_OUTCOME: ${{ steps.frontend_typecheck.outcome }}
        shell: bash
        run: |
          test "$FORMAT_OUTCOME" = success
          test "$BACKEND_OUTCOME" = success
          test "$FRONTEND_OUTCOME" = success
