name: PF Review Checks

on:
  push:
    branches:
      - codex/pfv2-1702-review-issues
    paths:
      - 'pkg/personalfinance/**'
      - 'pkg/api/**'
      - 'src/features/personal-finance/**'
      - 'go.mod'
      - 'go.sum'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pfv2-review-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'pkg/personalfinance/**'
      - 'pkg/api/**'
      - 'src/features/personal-finance/**'
      - 'go.mod'
      - 'go.sum'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pfv2-review-ci.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: pf-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Apply deterministic source fixes
        if: github.event_name == 'push'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          rebuild = Path('pkg/personalfinance/organizer/rebuild.go')
          text = rebuild.read_text()
          old = 'nextEvent, applyErr := applyEventCorrection(&working, request.Correction, action.ActionId, now)'
          new = '''relations, relationErr := tx.ListRelations(event.EventId)
          if relationErr != nil {
              return relationErr
          }
          nextEvent, applyErr := applyEventCorrection(&working, request.Correction, relations, action.ActionId, now)'''
          if old in text:
              rebuild.write_text(text.replace(old, new, 1))

          resolution = Path('pkg/personalfinance/organizer/review_issue_resolution.go')
          text = resolution.read_text()
          resolution.write_text(text.replace('\n\t"fmt"', '', 1))
          PY

      - name: Determine changed Go files
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git merge-base HEAD origin/main)"
          fi
          git diff --name-only --diff-filter=ACMRT "$base"...HEAD -- '*.go' > /tmp/changed-go.txt

      - name: Format and persist deterministic fixes
        if: github.event_name == 'push'
        shell: bash
        run: |
          if [ -s /tmp/changed-go.txt ]; then
            xargs gofmt -w < /tmp/changed-go.txt
          fi
          if ! git diff --quiet -- '*.go'; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add -- '*.go'
            git commit -m 'fix(pf): apply focused compile and formatting fixes'
            git push
          fi

      - name: Verify formatting
        id: format
        continue-on-error: true
        shell: bash
        run: |
          files=$(cat /tmp/changed-go.txt)
          if [ -n "$files" ]; then
            unformatted=$(gofmt -l $files)
            if [ -n "$unformatted" ]; then
              printf 'Unformatted Go files:\n%s\n' "$unformatted" | tee /tmp/format.log
              exit 1
            fi
          fi
          echo 'All changed Go files are formatted.' > /tmp/format.log

      - name: Test personal finance backend
        id: backend_tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          go test ./pkg/personalfinance/... ./pkg/api/... 2>&1 | tee /tmp/backend.log

      - name: Install frontend dependencies
        id: frontend_install
        continue-on-error: true
        run: npm ci --ignore-scripts

      - name: Type-check frontend
        id: frontend_typecheck
        if: steps.frontend_install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ./node_modules/.bin/vue-tsc --noEmit 2>&1 | tee /tmp/frontend.log

      - name: Report result on draft PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          FORMAT_OUTCOME: ${{ steps.format.outcome }}
          BACKEND_OUTCOME: ${{ steps.backend_tests.outcome }}
          FRONTEND_INSTALL_OUTCOME: ${{ steps.frontend_install.outcome }}
          FRONTEND_OUTCOME: ${{ steps.frontend_typecheck.outcome }}
        shell: bash
        run: |
          {
            echo '<!-- pf-review-check-result -->'
            echo '### PF Review Checks'
            echo
            echo "Commit: \`${GITHUB_SHA}\`"
            echo
            echo "- Go formatting: **${FORMAT_OUTCOME}**"
            echo "- Personal-finance backend tests: **${BACKEND_OUTCOME}**"
            echo "- Frontend install: **${FRONTEND_INSTALL_OUTCOME}**"
            echo "- Vue/TypeScript type-check: **${FRONTEND_OUTCOME}**"
            for item in format backend frontend; do
              outcome_var="${item^^}_OUTCOME"
              outcome="${!outcome_var:-failure}"
              if [ "$outcome" != success ] && [ -f "/tmp/${item}.log" ]; then
                echo
                echo "<details><summary>${item} diagnostics</summary>"
                echo
                echo '```text'
                tail -n 120 "/tmp/${item}.log"
                echo '```'
                echo '</details>'
              fi
            done
          } > /tmp/pf-review-result.md
          gh pr comment 1 --repo "${GITHUB_REPOSITORY}" --body-file /tmp/pf-review-result.md

      - name: Enforce checks
        if: always()
        env:
          FORMAT_OUTCOME: ${{ steps.format.outcome }}
          BACKEND_OUTCOME: ${{ steps.backend_tests.outcome }}
          FRONTEND_INSTALL_OUTCOME: ${{ steps.frontend_install.outcome }}
          FRONTEND_OUTCOME: ${{ steps.frontend_typecheck.outcome }}
        shell: bash
        run: |
          test "$FORMAT_OUTCOME" = success
          test "$BACKEND_OUTCOME" = success
          test "$FRONTEND_INSTALL_OUTCOME" = success
          test "$FRONTEND_OUTCOME" = success
