name: PF Review Checks

on:
  push:
    branches:
      - codex/pfv2-1702-review-issues
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: pf-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply exact review grouping batch once
        if: github.event_name == 'push'
        shell: bash
        run: |
          if grep -q 'SameEventCandidateGroups map\[string\]\[\]int64' pkg/personalfinance/organizer/planner.go; then
            exit 0
          fi
          python3 - <<'PY'
          import base64
          import gzip
          from pathlib import Path
          payload = """"""
          Path('/tmp/pfv2-exact.patch').write_bytes(gzip.decompress(base64.b64decode(payload)))
          PY
          git apply --check /tmp/pfv2-exact.patch
          git apply /tmp/pfv2-exact.patch
          gofmt -w pkg/personalfinance/organizer/*.go
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'refactor(pf): preserve exact review candidates and safe reorganization'
          git push

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Verify changed Go formatting
        id: format
        continue-on-error: true
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git merge-base HEAD origin/main)"
          fi
          files=$(git diff --name-only --diff-filter=ACMRT "$base"...HEAD -- '*.go')
          if [ -n "$files" ]; then
            unformatted=$(gofmt -l $files)
            if [ -n "$unformatted" ]; then
              printf 'Unformatted Go files:\n%s\n' "$unformatted" | tee /tmp/format.log
              exit 1
            fi
          fi
          echo 'All changed Go files are formatted.' | tee /tmp/format.log

      - name: Test personal-finance backend
        id: backend_tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          go test -count=1 ./pkg/personalfinance/... ./pkg/api/... 2>&1 | tee /tmp/backend.log

      - name: Install frontend dependencies
        id: frontend_install
        continue-on-error: true
        shell: bash
        run: npm ci --ignore-scripts 2>&1 | tee /tmp/frontend-install.log

      - name: Type-check frontend
        id: frontend_typecheck
        if: steps.frontend_install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ./node_modules/.bin/vue-tsc --noEmit 2>&1 | tee /tmp/frontend.log

      - name: Report result on draft PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          FORMAT_OUTCOME: ${{ steps.format.outcome }}
          BACKEND_OUTCOME: ${{ steps.backend_tests.outcome }}
          FRONTEND_INSTALL_OUTCOME: ${{ steps.frontend_install.outcome }}
          FRONTEND_OUTCOME: ${{ steps.frontend_typecheck.outcome }}
        shell: bash
        run: |
          {
            echo '<!-- pf-review-check-result -->'
            echo '### PF Review Checks'
            echo
            echo "Commit: \`${GITHUB_SHA}\`"
            echo
            echo "- Go formatting: **${FORMAT_OUTCOME}**"
            echo "- Personal-finance backend tests: **${BACKEND_OUTCOME}**"
            echo "- Frontend install: **${FRONTEND_INSTALL_OUTCOME}**"
            echo "- Vue/TypeScript type-check: **${FRONTEND_OUTCOME}**"
            for item in format backend frontend-install frontend; do
              case "$item" in
                format) outcome="$FORMAT_OUTCOME" ;;
                backend) outcome="$BACKEND_OUTCOME" ;;
                frontend-install) outcome="$FRONTEND_INSTALL_OUTCOME" ;;
                frontend) outcome="$FRONTEND_OUTCOME" ;;
              esac
              if [ "$outcome" != success ] && [ -f "/tmp/${item}.log" ]; then
                echo
                echo "<details><summary>${item} diagnostics</summary>"
                echo
                echo '```text'
                tail -n 180 "/tmp/${item}.log"
                echo '```'
                echo '</details>'
              fi
            done
          } > /tmp/pf-review-result.md
          gh pr comment 1 --repo "${GITHUB_REPOSITORY}" --body-file /tmp/pf-review-result.md

      - name: Enforce checks
        if: always()
        env:
          FORMAT_OUTCOME: ${{ steps.format.outcome }}
          BACKEND_OUTCOME: ${{ steps.backend_tests.outcome }}
          FRONTEND_INSTALL_OUTCOME: ${{ steps.frontend_install.outcome }}
          FRONTEND_OUTCOME: ${{ steps.frontend_typecheck.outcome }}
        shell: bash
        run: |
          test "$FORMAT_OUTCOME" = success
          test "$BACKEND_OUTCOME" = success
          test "$FRONTEND_INSTALL_OUTCOME" = success
          test "$FRONTEND_OUTCOME" = success
