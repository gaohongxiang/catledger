<svg viewBox="0 0 680 292" width="680" height="292" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="680" height="292" fill="#FFFFFF"/>
<g font-family="PingFang SC, Helvetica Neue, Arial, sans-serif">

<rect x="40" y="40" width="190" height="100" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="135" y="68" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">这份文件属于谁？</text>
<text x="135" y="94" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">账单主体</text>
<text x="135" y="120" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">决定这份账单归谁</text>

<rect x="245" y="40" width="190" height="100" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="68" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">这一行用什么工具？</text>
<text x="340" y="94" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">支付工具引用</text>
<text x="340" y="120" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">余额、银行卡或消费信贷</text>

<rect x="450" y="40" width="190" height="100" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="545" y="68" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3B6D11">余额归谁？</text>
<text x="545" y="94" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#27500A">账本账户</text>
<text x="545" y="120" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3B6D11">直接决定余额与统计</text>

<rect x="40" y="168" width="170" height="36" rx="18" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="125" y="186" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">张三的支付宝账单</text>
<rect x="255" y="168" width="170" height="36" rx="18" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="340" y="186" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">这一行用支付宝余额</text>
<rect x="470" y="168" width="170" height="36" rx="18" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="555" y="186" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">记进「支付宝」账户</text>
<path d="M210 186L255 186" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M425 186L470 186" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<text x="40" y="240" font-size="12" fill="#5F5E5A">一份支付宝账单可以同时使用余额、银行卡和消费信贷，不能整份绑定一个钱包</text>
<text x="40" y="262" font-size="12" fill="#5F5E5A">字段 source_account_id 里的 source 表示转出端，不表示文件来自哪个平台</text>
<text x="40" y="284" font-size="12" fill="#5F5E5A">越靠右越接近账本：前两者是原文与引用，只有账本账户影响余额</text>
</g>
</svg>
