<svg viewBox="0 0 680 380" width="680" height="380" xmlns="http://www.w3.org/2000/svg" role="img">
<title>账户归属与入账范围</title><desc>账单主体、支付工具引用和账本账户分别确认；先选择是否计入，计入则确认对应账本账户，不计入则保留原文。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="380" fill="#FFFFFF"/>
<g font-family="PingFang SC, Helvetica Neue, Arial, sans-serif">
<rect x="40" y="28" width="190" height="84" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="135.0" y="50" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#444441" font-weight="500">账单主体</text>
<text x="135.0" y="74" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">这份文件属于谁？</text>
<text x="135.0" y="94" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">确定账单归属</text>
<rect x="245" y="28" width="190" height="84" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340.0" y="50" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#0C447C" font-weight="500">支付工具引用</text>
<text x="340.0" y="74" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">这一行用了什么工具？</text>
<text x="340.0" y="94" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">余额、银行卡或消费信贷</text>
<rect x="450" y="28" width="190" height="84" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="545.0" y="50" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#27500A" font-weight="500">账本账户</text>
<text x="545.0" y="74" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3B6D11">余额归哪个账户？</text>
<text x="545.0" y="94" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3B6D11">正式交易记入的账户</text>
<rect x="40" y="150" width="170" height="60" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="125.0" y="172" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441" font-weight="500">一份支付宝账单</text>
<text x="125.0" y="196" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5F5E5A">包含多种支付工具</text>
<path d="M210 176L253 176" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="255" y="150" width="170" height="60" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340.0" y="172" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0C447C" font-weight="500">这行使用某张银行卡</text>
<text x="340.0" y="196" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#185FA5">按这张卡确认是否计入</text>
<path d="M425 176L468 176" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="447" y="160" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#3B6D11">计入</text>
<rect x="470" y="150" width="170" height="60" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="555.0" y="172" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#27500A" font-weight="500">对应银行卡账本账户</text>
<text x="555.0" y="196" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#3B6D11">已有账户／新账户草稿</text>
<path d="M340 210L340 242" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="356" y="226" text-anchor="start" dominant-baseline="central" font-size="11" fill="#5F5E5A">不计入</text>
<rect x="225" y="244" width="230" height="60" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="340.0" y="266" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#444441" font-weight="500">本次不计入</text>
<text x="340.0" y="290" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">保留原文，对应记录不生成交易</text>
<text x="40" y="334" text-anchor="start" dominant-baseline="central" font-size="12" fill="#5F5E5A">同一份账单按实际账户分别确认，不能整份绑定一个钱包。</text>
<text x="40" y="356" text-anchor="start" dominant-baseline="central" font-size="12" fill="#5F5E5A">本次排除只作用于明确范围，不自动变成以后都忽略。</text>
</g>
</svg>
