<svg viewBox="0 0 680 454" width="680" height="454" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="680" height="454" fill="#FFFFFF"/>
<g font-family="PingFang SC, Helvetica Neue, Arial, sans-serif">

<rect x="40" y="40" width="340" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="210" y="62" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">来源文件与解析批次</text>
<text x="210" y="82" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">用户提供了哪份资料，按哪个版本解析</text>

<path d="M210 96L210 136" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="222" y="118" font-size="12" fill="#5F5E5A">1 : N</text>

<rect x="40" y="136" width="340" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="210" y="158" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">原始行与来源身份</text>
<text x="210" y="178" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">原文是什么，这条证据是否已经出现</text>

<path d="M210 192L210 232" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="222" y="214" font-size="12" fill="#5F5E5A">N : 1</text>

<rect x="40" y="232" width="340" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="210" y="254" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">经济事件</text>
<text x="210" y="274" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">多份证据描述的可能是哪一次资金活动</text>

<path d="M210 288L210 328" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="222" y="310" font-size="12" fill="#5F5E5A">1 : N</text>

<rect x="40" y="328" width="340" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="210" y="350" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#27500A">正式交易</text>
<text x="210" y="370" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3B6D11">哪个账户在何时记了多少资金变化，依据是什么</text>

<rect x="420" y="232" width="220" height="56" rx="8" fill="none" stroke="#185FA5" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="530" y="254" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">核对问题与人工决定</text>
<text x="530" y="274" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">哪些事实不明确，用户确认了什么</text>
<path d="M380 260L420 260" fill="none" stroke="#185FA5" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

<rect x="420" y="328" width="220" height="56" rx="8" fill="none" stroke="#3B6D11" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="530" y="350" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#27500A">贷款资料 · 期次 · 来源关联</text>
<text x="530" y="370" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3B6D11">本金依据、计划成本与进度</text>
<path d="M380 356L420 356" fill="none" stroke="#3B6D11" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

<text x="40" y="412" font-size="12" fill="#5F5E5A">行数、事件数、交易数不是同一个数量：两条证据可能描述同一次活动，一次活动也可能拆成本金与费用两笔交易</text>
<text x="40" y="434" font-size="12" fill="#5F5E5A">只有正式交易改变余额；事件、问题与贷款资料都不单独计入</text>
</g>
</svg>
