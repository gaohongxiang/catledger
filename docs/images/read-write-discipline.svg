<svg viewBox="0 0 680 384" width="680" height="384" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="680" height="384" fill="#FFFFFF"/>
<g font-family="PingFang SC, Helvetica Neue, Arial, sans-serif">

<text x="640" y="48" text-anchor="end" font-size="12" fill="#5F5E5A">时间</text>
<path d="M60 60L636 60" fill="none" stroke="#B4B2A9" stroke-width="1.5" marker-end="url(#arrow)"/>

<text x="40" y="126" font-size="12" fill="#888780">读</text>
<path d="M80 126L600 126" fill="none" stroke="#B4B2A9" stroke-width="1"/>
<circle cx="140" cy="126" r="6" fill="#888780"/>
<text x="140" y="150" text-anchor="middle" font-size="12" fill="#5F5E5A">发出读取</text>
<circle cx="320" cy="126" r="6" fill="#888780"/>
<text x="320" y="150" text-anchor="middle" font-size="12" fill="#5F5E5A">视图换版</text>
<circle cx="500" cy="126" r="6" fill="#A32D2D"/>
<text x="500" y="150" text-anchor="middle" font-size="12" fill="#A32D2D">旧响应到达，丢弃</text>

<text x="40" y="226" font-size="12" fill="#888780">写</text>
<path d="M80 226L600 226" fill="none" stroke="#B4B2A9" stroke-width="1"/>
<circle cx="140" cy="226" r="6" fill="#185FA5"/>
<text x="140" y="250" text-anchor="middle" font-size="12" fill="#5F5E5A">写请求已发出</text>
<circle cx="320" cy="226" r="6" fill="#185FA5"/>
<text x="320" y="250" text-anchor="middle" font-size="12" fill="#5F5E5A">离开页面或超时</text>
<circle cx="500" cy="226" r="6" fill="#3B6D11"/>
<text x="500" y="250" text-anchor="middle" font-size="12" fill="#3B6D11">用原 requestId 核实</text>

<text x="40" y="300" font-size="12" fill="#5F5E5A">读可以失效：新视图或新版本产生后，旧响应不得回填当前页面</text>
<text x="40" y="322" font-size="12" fill="#5F5E5A">写不能被当作没发生：结果未知用原请求核实，不换键重发第二次</text>
<text x="40" y="344" font-size="12" fill="#5F5E5A">写成功而摘要失败：保留成功并提示明细待刷新，不重做业务写入</text>
<text x="40" y="366" font-size="12" fill="#5F5E5A">编辑中遇到后台更新：延后应用，不覆盖正在输入的内容</text>
</g>
</svg>
