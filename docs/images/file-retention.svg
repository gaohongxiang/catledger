<svg viewBox="0 0 680 400" width="1360" height="800" xmlns="http://www.w3.org/2000/svg" role="img">
<title>原件保留与后台清理</title>
<desc>等待上传保留1天，解析失败或待列映射保留30天，已解析未入账保留7天，已入账、重复或已丢弃尽快删除。新导入准备成功后清扫当前用户最多10个到期对象；每日北京时间03:00由无微信OPENID的Timer事件全局清扫最多20个。先删除云存储对象，成功后才写删除标记；数据库原始行、来源身份、回执和正式账目保留。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="400" fill="#FFFFFF"/>
<g font-family="PingFang SC, Helvetica Neue, Arial, sans-serif">
<text x="24" y="26" text-anchor="start" dominant-baseline="central" font-size="15" fill="#2B2A26" font-weight="600">原件保留与后台清理</text>
<text x="24" y="48" text-anchor="start" dominant-baseline="central" font-size="11" fill="#5F5E5A">原件按状态限期保留；删除原件不删除数据库原文、来源身份和审计。</text>

<g data-card="true"><rect x="24" y="70" width="145" height="92" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.7"/>
<text x="96.5" y="96" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#633806" font-weight="600">等待上传</text>
<text x="96.5" y="120" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#854F0B" font-weight="600">1 天</text>
<text x="96.5" y="142" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#5F5E5A">上传中断可重试</text>
</g>
<g data-card="true"><rect x="181" y="70" width="145" height="92" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.7"/>
<text x="253.5" y="96" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#633806" font-weight="600">失败／待映射</text>
<text x="253.5" y="120" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#854F0B" font-weight="600">30 天</text>
<text x="253.5" y="142" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#5F5E5A">重新解析或列映射</text>
</g>
<g data-card="true"><rect x="338" y="70" width="145" height="92" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.7"/>
<text x="410.5" y="96" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0C447C" font-weight="600">已解析未入账</text>
<text x="410.5" y="120" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#185FA5" font-weight="600">7 天</text>
<text x="410.5" y="142" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#5F5E5A">核对不依赖原件</text>
</g>
<g data-card="true"><rect x="495" y="70" width="161" height="92" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.7"/>
<text x="575.5" y="96" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#27500A" font-weight="600">已入账／重复／丢弃</text>
<text x="575.5" y="120" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#3B6D11" font-weight="600">尽快删除</text>
<text x="575.5" y="142" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#5F5E5A">已不需要原件</text>
</g>

<rect x="24" y="178" width="632" height="34" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.7"/>
<text x="340" y="195" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#444441">到期对象：content_deleted_at 为空 + 状态与更新时间达到保留期</text>
<path d="M340 212V224" fill="none" stroke="#888780" stroke-width="1.3"/>
<path d="M174 224H506" fill="none" stroke="#888780" stroke-width="1.3"/>
<path d="M174 224V232" fill="none" stroke="#888780" stroke-width="1.3" marker-end="url(#arrow)"/>
<path d="M506 224V232" fill="none" stroke="#888780" stroke-width="1.3" marker-end="url(#arrow)"/>

<g data-card="true"><rect x="24" y="234" width="300" height="70" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.7"/>
<text x="174" y="254" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#2B2A26" font-weight="600">新导入准备成功后</text>
<text x="174" y="278" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5F5E5A">当前用户 · 最多 10 个到期对象</text>
<text x="174" y="296" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#888780">失败不阻断本次准备</text>
</g>
<g data-card="true"><rect x="356" y="234" width="300" height="70" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.7"/>
<text x="506" y="254" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0C447C" font-weight="600">每日 03:00（北京时间）</text>
<text x="506" y="278" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#185FA5">全局 · 最多 20 个对象</text>
<text x="506" y="296" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#185FA5">仅 Type=Timer 且无微信 OPENID</text>
</g>

<g data-card="true"><rect x="24" y="320" width="632" height="58" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.7"/>
<text x="340" y="340" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#27500A" font-weight="600">先删除云存储对象，成功后才写 content_deleted_at；失败下次重试</text>
<text x="340" y="362" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#3B6D11">数据库原始行、来源身份、回执和正式交易保留；删除原件不等于删除证据</text>
</g>
</g>
</svg>
