<svg viewBox="0 0 680 396" width="680" height="396" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="396" fill="#FFFFFF"/>
<g font-family="PingFang SC, Helvetica Neue, Arial, sans-serif">
<rect x="190" y="28" width="300" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340.0" y="50" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#0C447C" font-weight="500">一行账单原文</text>
<text x="340.0" y="74" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">交易号 · 订单号 · 文件与行位置</text>
<path d="M340 84L340 98" fill="none" stroke="#888780" stroke-width="1.5"/>
<path d="M130 98L550 98" fill="none" stroke="#888780" stroke-width="1.5"/>
<path d="M130 98L130 114" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 98L340 114" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M550 98L550 114" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="116" width="180" height="64" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="130.0" y="138" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#444441" font-weight="500">① 可靠交易号</text>
<text x="130.0" y="162" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">脱敏编号不使用</text>
<rect x="250" y="116" width="180" height="64" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="340.0" y="138" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#444441" font-weight="500">② 订单号＋商户单号</text>
<text x="340.0" y="162" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">两者都可靠才使用</text>
<rect x="460" y="116" width="180" height="64" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="550.0" y="138" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#444441" font-weight="500">③ 前两种不可用</text>
<text x="550.0" y="162" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">文件指纹＋行位置</text>
<path d="M130 180L130 194" fill="none" stroke="#888780" stroke-width="1.5"/>
<path d="M340 180L340 194" fill="none" stroke="#888780" stroke-width="1.5"/>
<path d="M550 180L550 194" fill="none" stroke="#888780" stroke-width="1.5"/>
<path d="M130 194L550 194" fill="none" stroke="#888780" stroke-width="1.5"/>
<path d="M340 194L340 210" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="140" y="212" width="400" height="60" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="340.0" y="234" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#27500A" font-weight="500">按顺序取第一个可用的，形成来源身份</text>
<text x="340.0" y="258" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3B6D11">在同一用户与来源范围内检查重复</text>
<text x="40" y="300" text-anchor="start" dominant-baseline="central" font-size="12" fill="#5F5E5A">银行须有可靠账户身份才能使用编号，否则退回文件指纹与行位置。</text>
<text x="40" y="324" text-anchor="start" dominant-baseline="central" font-size="12" fill="#5F5E5A">另存文件只影响依赖文件指纹的身份，可靠编号仍可识别同一来源。</text>
<text x="40" y="348" text-anchor="start" dominant-baseline="central" font-size="12" fill="#5F5E5A">同身份还要核验金额、币种、方向与经济效果；冲突保留证据并转人工。</text>
<text x="40" y="372" text-anchor="start" dominant-baseline="central" font-size="12" fill="#5F5E5A">一条来源可对应零笔、一笔或多笔正式交易，身份存在不等于已入账。</text>
</g>
</svg>
