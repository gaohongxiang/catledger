<svg viewBox="0 0 680 344" width="680" height="344" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="680" height="344" fill="#FFFFFF"/>
<g font-family="PingFang SC, Helvetica Neue, Arial, sans-serif">

<rect x="190" y="40" width="300" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="58" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">一行账单原文</text>
<text x="340" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">交易号 · 订单号 · 商户订单号 · 文件与行位置</text>

<path d="M340 92L340 104" fill="none" stroke="#888780" stroke-width="1.5"/>
<path d="M130 104L550 104" fill="none" stroke="#888780" stroke-width="1.5"/>
<path d="M130 104L130 116" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 104L340 116" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M550 104L550 116" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="116" width="180" height="64" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="130" y="138" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">① 有交易号</text>
<text x="130" y="160" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">脱敏的不算数</text>

<rect x="250" y="116" width="180" height="64" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="340" y="138" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">② 订单号 + 商户单号</text>
<text x="340" y="160" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">两者都有才成立</text>

<rect x="460" y="116" width="180" height="64" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="550" y="138" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">③ 都没有</text>
<text x="550" y="160" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">文件指纹 + 行位置</text>

<path d="M130 180L130 190" fill="none" stroke="#888780" stroke-width="1.5"/>
<path d="M550 180L550 190" fill="none" stroke="#888780" stroke-width="1.5"/>
<path d="M130 190L550 190" fill="none" stroke="#888780" stroke-width="1.5"/>
<path d="M340 190L340 200" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="140" y="200" width="400" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="340" y="218" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#27500A">按顺序取第一个可用的，算成身份键</text>
<text x="340" y="238" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3B6D11">唯一约束：用户 + 来源类型 + 身份键</text>

<text x="40" y="286" font-size="12" fill="#5F5E5A">身份键只证明是同一条记录，不证明内容没变：另存核心摘要（金额 · 币种 · 方向 · 经济效果）</text>
<text x="40" y="308" font-size="12" fill="#5F5E5A">键相同、摘要不同 = 冲突，转人工，不静默覆盖</text>
<text x="40" y="330" font-size="12" fill="#5F5E5A">身份不是账本账户，也不是正式交易 ID：一条证据可能对应 0 笔或 1 笔交易</text>
</g>
</svg>
