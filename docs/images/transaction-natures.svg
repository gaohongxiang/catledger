<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1560" viewBox="0 0 1200 1560" role="img" aria-labelledby="title desc">
<title id="title">交易性质：8 种明确性质，另有待确定</title><desc id="desc">蓝色是账本内账户，灰色是外部。发工资、支出、本人转账、贷款到账、还款、退款、费用、余额调整的完整示例。朋友借还采用普通收入与支出口径。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#89929d"/></marker></defs>
<g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<rect x="0" y="0" width="1200" height="1560" rx="0" fill="#ffffff" stroke="#ffffff"/>
<text x="32" y="47" font-size="30" text-anchor="start" fill="#20262d" font-weight="600">交易性质：8 种明确性质，另有待确定</text>
<text x="32" y="83" font-size="20" text-anchor="start" fill="#616b77" font-weight="400">账户回答“钱记在哪里”，性质回答“这笔钱怎么统计”。以下均为合成示例。</text>
<text x="36" y="137" font-size="24" text-anchor="start" fill="#20262d" font-weight="500">① 收入 · 公司发工资</text>
<text x="131" y="174" font-size="19" text-anchor="middle" fill="#616b77" font-weight="400">外部</text>
<text x="489" y="174" font-size="19" text-anchor="middle" fill="#616b77" font-weight="400">我的</text>
<rect x="36" y="190" width="190" height="65" rx="10" fill="#f0f1f3" stroke="#d6dee9"/>
<rect x="394" y="190" width="190" height="65" rx="10" fill="#e8effb" stroke="#d6dee9"/>
