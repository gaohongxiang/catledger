<text x="60" y="1163" font-size="22" text-anchor="start" fill="#20262d" font-weight="500">待确定：缺少性质、必要账户或关键事实时，保留待核对。</text>
<text x="60" y="1193" font-size="19" text-anchor="start" fill="#616b77" font-weight="400">待确定不是外部，也不是零金额，更不等于本次不计入。</text>
