<text x="310" y="295" font-size="22" text-anchor="middle" fill="#20262d" font-weight="500">收入 +5,000 元</text>
<text x="310" y="326" font-size="18" text-anchor="middle" fill="#616b77" font-weight="400">收款账户增加 5,000 元</text>
<text x="620" y="137" font-size="24" text-anchor="start" fill="#20262d" font-weight="500">② 支出 · 买东西</text>
<text x="715" y="174" font-size="19" text-anchor="middle" fill="#616b77" font-weight="400">我的</text>
<text x="1073" y="174" font-size="19" text-anchor="middle" fill="#616b77" font-weight="400">外部</text>
