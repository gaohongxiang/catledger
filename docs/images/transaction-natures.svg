<text x="489" y="231" font-size="23" text-anchor="middle" fill="#20262d" font-weight="400">银行卡</text>
<line x1="244" y1="222" x2="376" y2="222" stroke="#89929d" stroke-width="2" marker-end="url(#arrow)"/>
