<svg viewBox="0 0 680 708" width="680" height="708" xmlns="http://www.w3.org/2000/svg" role="img">
<title>先确认账户与是否计入，再核对资金状态、性质和金额</title><desc>本次不计入的记录保留原文；计入的记录核对资金状态、性质与关系、金额组成，通过入账检查后生成正式交易。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="708" fill="#FFFFFF"/>
<g font-family="PingFang SC, Helvetica Neue, Arial, sans-serif">
<rect x="40" y="24" width="600" height="60" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340.0" y="46" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#0C447C" font-weight="500">账单记录与原文</text>
<text x="340.0" y="70" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">先确认账户与是否计入，再核对资金事实与金额</text>
<path d="M216 84L216 102" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="104" width="352" height="84" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="216.0" y="126" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#27500A" font-weight="500">① 确认账户与是否计入</text>
<text x="216.0" y="150" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3B6D11">计入：选已有账户，或准备新建账户</text>
<text x="216.0" y="170" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3B6D11">核对收付款账户，明确本次范围</text>
<path d="M392 146L430 146" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="432" y="104" width="208" height="84" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="536.0" y="126" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#444441" font-weight="500">本次不计入</text>
<text x="536.0" y="150" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">保留原文与排除决定</text>
<text x="536.0" y="170" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">对应记录不生成正式交易</text>
<path d="M216 188L216 220" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="232" y="204" text-anchor="start" dominant-baseline="central" font-size="11" fill="#3B6D11">计入</text>
<rect x="40" y="222" width="352" height="84" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="216.0" y="244" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#0C447C" font-weight="500">② 核实资金状态</text>
<text x="216.0" y="268" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">确认是否实际扣款或到账</text>
<text x="216.0" y="288" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">依据原始状态与资金动作核实</text>
<path d="M392 264L430 264" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="432" y="222" width="208" height="84" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="536.0" y="244" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#633806" font-weight="500">未发生／无法确认</text>
<text x="536.0" y="268" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">失败／未付款关闭：只留证据</text>
<text x="536.0" y="288" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">未知／矛盾：待核对</text>
<path d="M216 306L216 342" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="232" y="324" text-anchor="start" dominant-baseline="central" font-size="11" fill="#185FA5">资金事实已明确</text>
<rect x="40" y="344" width="352" height="84" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="216.0" y="366" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#0C447C" font-weight="500">③ 确认性质与关系</text>
<text x="216.0" y="390" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">消费、收入、退款、转账、借还款等</text>
<text x="216.0" y="410" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">退款核对原消费，还款分清本金与费用</text>
<path d="M392 386L430 386" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="3 3"/>
<rect x="432" y="344" width="208" height="84" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="536.0" y="366" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#444441" font-weight="500">收支口径看性质与关系</text>
<text x="536.0" y="390" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">关联退款冲减支出</text>
<text x="536.0" y="410" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">转账／余额调整不计收支</text>
<path d="M216 428L216 456" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="458" width="352" height="84" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="216.0" y="480" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#27500A" font-weight="500">④ 核对金额组成</text>
<text x="216.0" y="504" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3B6D11">核对总额、各账户分配、本金与费用</text>
<text x="216.0" y="524" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3B6D11">方向正确，各项金额合计一致</text>
<path d="M392 500L430 500" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="432" y="458" width="208" height="84" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="536.0" y="480" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#633806" font-weight="500">仍有缺项／冲突</text>
<text x="536.0" y="504" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">继续核对</text>
<text x="536.0" y="524" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">保留已保存的草稿</text>
<path d="M216 542L216 570" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="572" width="352" height="64" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="216.0" y="594" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#27500A" font-weight="500">通过入账检查后，生成正式交易</text>
<text x="216.0" y="618" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3B6D11">本批账目一起提交，失败则回滚</text>
<text x="40" y="660" text-anchor="start" dominant-baseline="central" font-size="12" fill="#5F5E5A">排除不改变原始资金事实；本次排除不自动变成以后都忽略。</text>
<text x="40" y="684" text-anchor="start" dominant-baseline="central" font-size="12" fill="#5F5E5A">是否计入由用户选择；收支口径由资金性质与关系决定。</text>
</g>
</svg>
