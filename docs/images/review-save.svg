<svg viewBox="0 0 680 474" width="680" height="474" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="680" height="474" fill="#FFFFFF"/>
<g font-family="PingFang SC, Helvetica Neue, Arial, sans-serif">

<rect x="40" y="40" width="360" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="220" y="62" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">待核对卡片</text>
<text x="220" y="82" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">每笔附当前优先可处理的问题入口</text>

<path d="M220 96L220 136" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="136" width="360" height="64" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="220" y="158" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">编辑器：同一份草稿</text>
<text x="220" y="180" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">一个主按钮，由同一份校验决定存草稿还是存核对</text>

<path d="M220 200L220 240" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="240" width="360" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="220" y="262" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">保存时校验</text>
<text x="220" y="282" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">用户、批次与事件版本、引用可用性</text>

<path d="M220 296L220 318" fill="none" stroke="#888780" stroke-width="1.5"/>
<path d="M134 318L552 318" fill="none" stroke="#888780" stroke-width="1.5"/>
<path d="M134 318L134 340" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M343 318L343 340" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M552 318L552 340" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="340" width="188" height="64" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="134" y="362" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#27500A">保存成功</text>
<text x="134" y="384" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3B6D11">进入已核对列表</text>

<rect x="249" y="340" width="188" height="64" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="343" y="362" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">已保存，仍待核对</text>
<text x="343" y="384" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">来源、同笔或贷款阻断未解</text>

<rect x="458" y="340" width="182" height="64" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="549" y="362" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#791F1F">拒绝保存</text>
<text x="549" y="384" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#A32D2D">保留输入，修正后重试</text>

<text x="40" y="432" font-size="12" fill="#5F5E5A">一次保存把字段、决定、关系、问题成员和版本放进同一事务，任一步失败整体回滚</text>
<text x="40" y="454" font-size="12" fill="#5F5E5A">结果未知时冻结原 requestId 和完整请求，重试只核实原结果，不换请求重存</text>
</g>
</svg>
