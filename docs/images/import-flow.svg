<svg viewBox="0 0 680 292" width="680" height="292" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="680" height="292" fill="#FFFFFF"/>
<g font-family="PingFang SC, Helvetica Neue, Arial, sans-serif">

<text x="68" y="62" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#888780">页面</text>
<text x="68" y="152" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#888780">后台</text>

<rect x="104" y="40" width="119" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="163" y="62" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">① 选择文件</text>
<path d="M223 62L243 62" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="243" y="40" width="119" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="302" y="62" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">② 确认账户</text>
<path d="M362 62L382 62" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="382" y="40" width="119" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="441" y="62" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">③ 核对交易</text>
<path d="M501 62L521 62" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="521" y="40" width="119" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="580" y="62" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">④ 确认入账</text>

<path d="M163 84L163 104" fill="none" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="3 3"/>
<path d="M302 84L302 104" fill="none" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="3 3"/>
<path d="M441 84L441 104" fill="none" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="3 3"/>
<path d="M580 84L580 104" fill="none" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="3 3"/>

<rect x="104" y="104" width="119" height="96" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="163" y="124" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">私有上传</text>
<text x="163" y="144" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">逐文件解析</text>
<text x="163" y="164" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">来源身份</text>
<text x="163" y="184" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">建立整理批次</text>

<rect x="243" y="104" width="119" height="96" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="302" y="132" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">账户归属</text>
<text x="302" y="152" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">事件与关系</text>
<text x="302" y="172" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">待核对问题</text>

<rect x="382" y="104" width="119" height="96" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="441" y="132" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">保存决定</text>
<text x="441" y="152" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">重算受影响结果</text>
<text x="441" y="172" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">仍有阻断则留</text>

<rect x="521" y="104" width="119" height="96" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="580" y="132" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">锁内复查</text>
<text x="580" y="152" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#2C2C2A">整批原子入账</text>
<text x="580" y="172" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">回执与追溯</text>

<text x="340" y="230" text-anchor="middle" font-size="12" fill="#5F5E5A">页面上是四个步骤，后台是逐文件解析、账户归属、问题核对与整批事务四段，不是一个请求</text>
<text x="340" y="252" text-anchor="middle" font-size="12" fill="#5F5E5A">任一份文件失败只影响该文件，重试该文件而不重复上传全部</text>
<text x="340" y="274" text-anchor="middle" font-size="12" fill="#5F5E5A">上传、解析、整理成功都不等于记账，只有第 ④ 步的事务改变余额</text>
</g>
</svg>
