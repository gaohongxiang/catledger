<svg viewBox="0 0 680 450" width="680" height="450" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="450" fill="#FFFFFF"/>
<g font-family="PingFang SC, Helvetica Neue, Arial, sans-serif">
<rect x="40" y="28" width="600" height="60" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340.0" y="50" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#0C447C" font-weight="500">确认本次提交</text>
<text x="340.0" y="74" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">原请求先查已有结果；新提交再核验用户、完整内容与来源范围</text>
<path d="M340 88L340 116" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="28" y="120" width="624" height="266" rx="10" fill="none" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<text x="340" y="140" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#888780">以下步骤在同一事务中完成</text>
<rect x="40" y="160" width="600" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<circle cx="66" cy="182" r="12" fill="#888780"/>
<text x="66" y="182" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#FFFFFF" font-weight="500">1</text>
<text x="92" y="182" text-anchor="start" dominant-baseline="central" font-size="14" fill="#444441" font-weight="500">应用本次决定</text>
<text x="246" y="182" text-anchor="start" dominant-baseline="central" font-size="12" fill="#5F5E5A">核实批次与原请求，应用账户、配对、编辑等选择</text>
<rect x="40" y="214" width="600" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<circle cx="66" cy="236" r="12" fill="#888780"/>
<text x="66" y="236" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#FFFFFF" font-weight="500">2</text>
<text x="92" y="236" text-anchor="start" dominant-baseline="central" font-size="14" fill="#444441" font-weight="500">复核当前账本</text>
<text x="246" y="236" text-anchor="start" dominant-baseline="central" font-size="12" fill="#5F5E5A">重查来源、账户、退款、贷款费用与现金约束</text>
<rect x="40" y="268" width="600" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<circle cx="66" cy="290" r="12" fill="#888780"/>
<text x="66" y="290" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#FFFFFF" font-weight="500">3</text>
<text x="92" y="290" text-anchor="start" dominant-baseline="central" font-size="14" fill="#444441" font-weight="500">创建或复用账目</text>
<text x="246" y="290" text-anchor="start" dominant-baseline="central" font-size="12" fill="#5F5E5A">只创建需要的新账户，保存交易及来源关系</text>
<rect x="40" y="322" width="600" height="44" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<circle cx="66" cy="344" r="12" fill="#3B6D11"/>
<text x="66" y="344" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#FFFFFF" font-weight="500">4</text>
<text x="92" y="344" text-anchor="start" dominant-baseline="central" font-size="14" fill="#27500A" font-weight="500">共同提交与清理</text>
<text x="246" y="344" text-anchor="start" dominant-baseline="central" font-size="12" fill="#3B6D11">保存结果与回执，清理本批临时对象和分块</text>
<text x="40" y="408" text-anchor="start" dominant-baseline="central" font-size="12" fill="#5F5E5A">事务内任一步失败，整批回滚；明确冲突只要求重新核对受影响事项。</text>
<text x="40" y="432" text-anchor="start" dominant-baseline="central" font-size="12" fill="#5F5E5A">结果未知时查询或重试原提交；确认成功后，本机再清理草稿。</text>
</g>
</svg>
